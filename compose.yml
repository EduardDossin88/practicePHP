services:
  db:
    image: postgres:15-alpine
    container_name: practice_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  php-fpm:
    build:
      context: .
      target: fpm
    container_name: practice_fpm
    env_file:
      - .env
    restart: always
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  php-cli:
    build:
      context: .
      target: cli
    container_name: practice_cli
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    profiles: ["cli"]

  web:
    image: nginx:alpine
    container_name: practice_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - php-fpm

volumes:
  db_data:
